name: Otomatik Filtre Yedekleme

on:
  push:
    branches: [ main ]
  workflow_dispatch:
    inputs:
      force_backup:
        description: 'Değişiklik olmasa da zorla yedekle'
        required: false
        default: false
        type: boolean

# Aynı merge'de hem bu iş akışı hem sürüm bump'ı main'e yazmaya çalışıyor; ikisi
# aynı concurrency grubunda olduğu için sırayla koşarlar, aksi hâlde ikincisinin
# push'u "fetch first" ile reddedilir.
concurrency:
  group: main-writes
  cancel-in-progress: false

jobs:
  backup-filters:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.x'
          cache: 'pip'
          cache-dependency-path: 'requirements.txt'
          
      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          
      - name: Yedekler klasörü kontrolü
        run: |
          if [ ! -d "yedekler" ]; then
            mkdir -p yedekler
            echo "📁 Yedekler klasörü oluşturuldu"
          fi
          
      - name: Türev listeleri üret (hosts + kategori alt listeleri)
        run: |
          python scripts/generate_hosts.py
          python scripts/generate_categories.py

      - name: Otomatik yedekleme çalıştır
        run: |
          if [ "${{ github.event.inputs.force_backup }}" = "true" ]; then
            python scripts/backup_filters.py --force
          else
            python scripts/backup_filters.py
          fi
          
      - name: Yedek dosyalarını commit et
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          
          # Yedekler + türev listelerde değişiklik var mı kontrol et
          DERIV="yedekler/ hosts.txt turk-adfilter-bahis.txt turk-adfilter-lite.txt"
          if git diff --quiet -- $DERIV && git diff --cached --quiet -- $DERIV; then
            echo "✅ Değişiklik yok (yedek/türev güncel)"
          else
            git add $DERIV
            
            # Commit mesajını oluştur
            COMMIT_MSG="🔄 Otomatik filtre yedekleme"
            
            if [ "${{ github.event.inputs.force_backup }}" = "true" ]; then
              COMMIT_MSG="$COMMIT_MSG (manuel tetikleme)"
            else
              # Hangi dosyalar değişti bilgisini ekle
              CHANGED_FILES=$(git diff --name-only HEAD~1 HEAD -- hosts.txt turk-adfilter.txt | tr '\n' ' ')
              if [ ! -z "$CHANGED_FILES" ]; then
                COMMIT_MSG="$COMMIT_MSG - Değişen dosyalar: $CHANGED_FILES"
              fi
            fi
            
            git commit -m "$COMMIT_MSG [skip ci]"
            git push
            
            echo "✅ Yedekler commit edildi ve push yapıldı"
          fi
          
      - name: Yedek istatistiklerini göster
        run: |
          echo "📊 Yedek İstatistikleri:"
          python scripts/backup_filters.py --info

      - name: Değişmez testleri (türev dosyalar + başlık + changelog)
        # Türev dosyalar bu iş akışında yeniden üretildiği için "hosts.txt ⊆ ana
        # liste", "alt listeler ana listenin alt kümesi" gibi kontroller burada
        # anlamlı; PR anında değil.
        run: |
          python -m unittest scripts.test_filter_invariants